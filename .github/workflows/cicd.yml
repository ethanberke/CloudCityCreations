name: CICD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      # ---------- FRONTEND ----------
      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      - name: Run ESLint (frontend)
        working-directory: ./client
        run: npm run lint

      - name: Run Prettier check (frontend)
        working-directory: ./client
        run: npm run prettier . --check

      # ---------- BACKEND ----------
      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci

      - name: Run ESLint (backend)
        working-directory: ./server
        run: npm run lint

      - name: Run Prettier check (backend)
        working-directory: ./server
        run: npm run prettier . --check

      # ---------- IMPORTER (Python) ----------
      # The recipe importer is the one service with tests, and this is the only
      # job that runs anything, so they live here rather than behind a test job
      # that would exist for one workspace.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependencies
        working-directory: ./scraper
        run: pip install -r requirements-dev.txt

      - name: Run Ruff lint + format check (importer)
        working-directory: ./scraper
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests (importer)
        working-directory: ./scraper
        run: python -m pytest -q


  # ---------- DOCKER BUILD ----------
  docker:
    runs-on: ubuntu-latest

    needs: lint #This guarantees docker build only runs if lint passes

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cloudcitycreations-client:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cloudcitycreations-server:latest

      - name: Build and push importer image
        uses: docker/build-push-action@v5
        with:
          context: ./scraper
          file: ./scraper/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cloudcitycreations-scraper:latest
