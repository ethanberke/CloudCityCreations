services:

  client:
    build: ./client
    env_file:
      - ./client/.env
    container_name: react_client
    command: npm run dev -- --host
    depends_on:
      - server
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules

  server:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      # server/.env holds localhost values so host-side `npm run dev` works;
      # inside compose the database is the `db` service. `environment` wins over
      # `env_file`, so one file serves both. These duplicate the dev-only
      # credentials already hardcoded on the `db` service below — no new secret.
      POSTGRES_HOST: db
      DATABASE_URL: postgres://postgres:password@db:5432/mydb
    container_name: node_server
    depends_on:
      - db
    ports:
      - "5000:5000"
    volumes:
      # Uploaded photos land in ./server/uploads on the host through this bind
      # mount, so they survive rebuilds and are the same files whether the
      # server runs here or via `npm run dev`. A deploy without this mount needs
      # a named volume at /app/uploads instead, or photos vanish on rebuild.
      - ./server:/app
      - /app/node_modules

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migration.sql:/docker-entrypoint-initdb.d/migration.sql

volumes:
  postgres_data:
